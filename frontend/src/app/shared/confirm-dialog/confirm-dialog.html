<div class="confirm-backdrop" *ngIf="confirm.options as opt" (click)="confirm.answer(false)">
  <div class="confirm-card" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">
    <h3 class="confirm-title" [class.danger]="opt.danger">{{ opt.title }}</h3>
    <p class="confirm-message">{{ opt.message }}</p>
    <div class="confirm-actions">
      <button type="button" class="btn-confirm-cancel" (click)="confirm.answer(false)">{{ opt.cancelText }}</button>
      <button type="button" class="btn-confirm-ok" [class.danger]="opt.danger" (click)="confirm.answer(true)">{{ opt.confirmText }}</button>
    </div>
  </div>
</div>
